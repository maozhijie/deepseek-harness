<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习中心 · learnhub</title>
<!-- Markdown/LaTeX 渲染：CDN 加载，失败时降级为纯文本 -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #faf9f7; --panel: #ffffff; --border: #e4e0da; --text: #2c2a27;
    --muted: #8a857d; --accent: #5a7d5a; --accent-weak: #eef3ee;
    --good: #3d8b3d; --bad: #c0392b; --warn: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1d1b; --panel: #262522; --border: #3a3833; --text: #ddd8d0;
      --muted: #8a857d; --accent: #8fb88f; --accent-weak: #2c332c;
      --good: #6fc06f; --bad: #e07a6b; --warn: #d9a94a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 24px;
    border-bottom: 1px solid var(--border); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; margin: 0; }
  header nav { display: flex; gap: 8px; margin-left: 16px; }
  header nav button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    padding: 5px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  header nav button.active { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 24px; }
  main.wide { max-width: 1200px; }
  h3 { margin: 0 0 14px; font-size: 19px; }
  button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input, select {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 6px 10px; border-radius: 8px; font-size: 14px;
  }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0; }
  .date { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card h4 { margin: 0 0 6px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .overdue { margin: 6px 0; padding-left: 4px; list-style: none; }
  .overdue li { margin: 3px 0; font-size: 14px; }
  .overdue .warn { color: var(--warn); }
  .ok { color: var(--good); font-size: 14px; }
  .ready, .gated { font-size: 14px; margin-top: 6px; }
  .node { color: var(--accent); cursor: pointer; border-bottom: 1px dashed var(--accent); }
  .node:hover { opacity: .75; }
  pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 13px; white-space: pre-wrap;
  }
  .picker { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .picker input { min-width: 220px; }
  .ex { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; }
  .ex-tag { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .ex-q { margin-bottom: 8px; }
  .ex-q p { margin: .4em 0; }
  .ex-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .ex-row input { flex: 1; min-width: 180px; }
  .ex-fb { margin-top: 8px; font-size: 14px; }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .self { display: inline-flex; gap: 6px; margin-left: 8px; }
  .summary { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-top: 16px; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 80vw; z-index: 99;
  }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--bad); color: #fff; }
  .log-box { margin-top: 14px; }
  /* —— 图谱 / 统计 / 提案 —— */
  #cy { width: 100%; height: 620px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; color: var(--muted); }
  .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .stats-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat-cell { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .stat-cell .n { font-size: 24px; font-weight: 600; }
  .stat-cell .t { color: var(--muted); font-size: 13px; }
  table.simple { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.simple th, table.simple td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  table.simple th { color: var(--muted); font-weight: 500; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12.5px; border: 1px solid var(--border); }
  .chip.pending { color: var(--warn); border-color: var(--warn); }
  .chip.applied { color: var(--good); border-color: var(--good); }
  .chip.rejected { color: var(--bad); border-color: var(--bad); }
  .prop-actions { display: flex; gap: 8px; margin-top: 8px; }
  /* —— 学习流（分节课程 → 练习 → 评分 → 下一步） —— */
  .lesson-progress { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
  .lp-dot { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 2px 10px; white-space: nowrap; }
  .lp-dot.cur { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }
  .lp-dot.done { opacity: .55; }
  .lesson-body { font-size: 15.5px; }
  .lesson-body h1, .lesson-body h2, .lesson-body h3 { margin: .9em 0 .45em; }
  .lesson-body p { margin: .5em 0; }
  .lesson-body img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin: .6em 0; }
  .lesson-body .mermaid { text-align: center; margin: .8em 0; }
  .lesson-nav { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .rate-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .next-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  /* —— 选择题选项 / 开放题作答框 —— */
  .opt-row { display: block; margin: 4px 0; cursor: pointer; }
  .opt-row input { margin-right: 8px; }
  textarea.answer { width: 100%; min-height: 96px; background: var(--panel); color: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; box-sizing: border-box; margin-bottom: 8px; }
  /* —— 课程工作区（树形）—— */
  .tree-region { font-weight: 600; padding: 6px 8px; margin-top: 8px; border-left: 3px solid #888; background: var(--panel); border-radius: 4px; }
  .tree-block { color: var(--muted, #888); margin: 6px 8px 2px; font-size: 13px; }
  .tree-node { display: flex; align-items: center; gap: 8px; padding: 3px 8px 3px 20px; }
  .tree-node .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .tree-node .meta { color: var(--muted, #888); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-node button { padding: 1px 10px; font-size: 12px; }
  .bank-q { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .bank-q .kind { display: inline-block; font-size: 11px; color: var(--muted, #888); border: 1px solid var(--border); border-radius: 8px; padding: 0 7px; margin-right: 6px; }
  .bank-q .result { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
  /* —— 推荐事件卡片（动态队列，仪表盘/学习入口/评分后共用） —— */
  .event-card { display: flex; gap: 12px; align-items: flex-start; }
  .event-card .ev-main { flex: 1; min-width: 0; }
  .event-card h4 { margin-bottom: 4px; }
  .event-card .primary { white-space: nowrap; margin-top: 2px; }
  .ev-badge { display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 12px; margin-right: 6px; border: 1px solid var(--border); }
  .ev-badge.review { color: var(--warn); border-color: var(--warn); }
  .ev-badge.learning { color: #4e79a7; border-color: #4e79a7; }
  .ev-badge.new { color: var(--good); border-color: var(--good); }
</style>
</head>
<body>
<header>
  <h1>🎓 学习中心</h1>
  <nav>
    <button id="tab-dashboard" class="active">仪表盘</button>
    <button id="tab-study">学习</button>
    <button id="tab-practice">练习面板</button>
    <button id="tab-tree">课程</button>
    <button id="tab-generate">生成</button>
    <button id="tab-graph">知识图谱</button>
    <button id="tab-stats">统计</button>
    <button id="tab-proposals">提案</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
'use strict';
/* ============ 基础设施 ============ */
const API = '/learnhub/api';
const appEl = document.getElementById('app');

async function api(path, init) {
  // no-store：状态类 GET（/status /recommend）绝不能被浏览器缓存，
  // 否则评分入库后面板仍显示旧队列（“学完不算完成”bug 的根因）。
  const opts = { cache: 'no-store' };
  if (init) {
    opts.method = 'POST';
    opts.headers = { 'content-type': 'application/json' };
    opts.body = JSON.stringify(init);
  }
  const res = await fetch(API + path, opts);
  let doc = null;
  try { doc = await res.json(); } catch {}
  if (!res.ok) throw new Error(doc && doc.error ? doc.error : `HTTP ${res.status}`);
  return doc;
}

let toastTimer = null;
function toast(msg, isErr) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

/** 题干 Markdown/LaTeX/图片/图表渲染：wikilink 图片转 API 链接 + marked + mermaid + katex，CDN 失败降级为转义纯文本。 */
function renderRich(container, text) {
  if (window.marked) {
    // OB 嵌入语法 → 标准 Markdown：图片走 /file 伺服（vault 相对路径），笔记链接降级为纯文本
    const prepared = text
      .replace(/!\[\[([^\]|]+?)(?:\|[^\]]*)?\]\]/g, (m, target) => {
        if (/\.(png|jpe?g|gif|webp|svg)$/i.test(target)) {
          const rel = target.replace(/^\/+/, '');
          const vault = rel.startsWith('学习中心/') ? rel : '学习中心/' + rel;
          return `![${target.split('/').pop()}](${API}/file?path=${encodeURIComponent(vault)})`;
        }
        return m;
      })
      .replace(/\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]/g, (m, t, alias) => alias || t.split('/').pop());
    container.innerHTML = window.marked.parse(prepared, { breaks: true });
    // 图表：```mermaid 围栏 → mermaid 渲染（CDN 失败保留代码块原文）
    runMermaid(container);
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(container, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true },
          ],
          throwOnError: false,
        });
      } catch {}
    }
  } else {
    container.textContent = text;
  }
}

/** mermaid 代码块渲染：失败时恢复原文代码块，不阻断正文。 */
async function runMermaid(container) {
  if (!window.mermaid) return;
  const blocks = [...container.querySelectorAll('code.language-mermaid')];
  if (!blocks.length) return;
  try { window.mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict' }); } catch {}
  for (let i = 0; i < blocks.length; i++) {
    const code = blocks[i];
    const src = code.textContent;
    const host = code.closest('pre') || code;
    const id = `mermaid-${Date.now()}-${i}`;
    try {
      const { svg } = await window.mermaid.render(id, src);
      const box = document.createElement('div');
      box.className = 'mermaid';
      box.innerHTML = svg;
      host.replaceWith(box);
    } catch (err) {
      console.warn('[learnhub] mermaid 渲染失败:', err.message);
    }
  }
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/** 按钮包装：执行期间禁用（OB actionButton 语义）。 */
function actionButton(parent, label, onClick, primary) {
  const btn = el('button', primary ? 'primary' : '', label);
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try { await onClick(); }
    catch (err) { toast(err.message, true); }
    finally { btn.disabled = false; }
  });
  parent.appendChild(btn);
  return btn;
}

/* ============ 全局状态 ============ */
const state = {
  tab: 'dashboard',
  course: '',
  node: '',
  skipPicker: false,
  items: [],
  results: new Map(), // ex → 是否正确（human 自评同样计入）
  autoWritePending: false, // 全部作答后自动写回的一次性闸门
  bankNode: '', // 工作区当前展开题库的节点
  bankCourse: '', // 工作区当前题库的课程
};

function switchTab(tab, opts) {
  state.tab = tab;
  if (opts && opts.course) state.course = opts.course;
  if (opts && opts.node) { state.node = opts.node; state.skipPicker = true; }
  for (const t of ['dashboard', 'study', 'practice', 'tree', 'generate', 'graph', 'stats', 'proposals']) {
    document.getElementById('tab-' + t).className = tab === t ? 'active' : '';
  }
  appEl.className = (tab === 'graph' || tab === 'tree') ? 'wide' : '';
  render();
}
document.getElementById('tab-dashboard').addEventListener('click', () => switchTab('dashboard'));
document.getElementById('tab-study').addEventListener('click', () => switchTab('study'));
document.getElementById('tab-practice').addEventListener('click', () => switchTab('practice'));
document.getElementById('tab-tree').addEventListener('click', () => switchTab('tree'));
document.getElementById('tab-generate').addEventListener('click', () => switchTab('generate'));
document.getElementById('tab-graph').addEventListener('click', () => switchTab('graph'));
document.getElementById('tab-stats').addEventListener('click', () => switchTab('stats'));
document.getElementById('tab-proposals').addEventListener('click', () => switchTab('proposals'));

/** 渲染互斥：异步渲染期间的新请求折叠为一次重渲染，防止两个 render 交错向 appEl 重复追加。 */
let rendering = false;
let rerenderQueued = false;

async function render() {
  if (rendering) { rerenderQueued = true; return; }
  rendering = true;
  try {
    do {
      rerenderQueued = false;
      if (cyInstance) { cyInstance.destroy(); cyInstance = null; }
      appEl.textContent = '';
      if (state.tab === 'dashboard') await renderDashboard();
      else if (state.tab === 'study') await renderStudy();
      else if (state.tab === 'practice') await renderPractice();
      else if (state.tab === 'tree') await renderWorkspace();
      else if (state.tab === 'generate') await renderGeneration();
      else if (state.tab === 'graph') await renderGraph();
      else if (state.tab === 'stats') await renderStats();
      else await renderProposals();
    } while (rerenderQueued);
  } finally {
    rendering = false;
  }
}

/* ============ 推荐事件卡片（动态队列：仪表盘/学习入口/评分后共用） ============ */
const EV_LABEL = { review: '复习', learning: '继续', new: '新课' };
const EV_BTN = { review: '去复习', learning: '继续学', new: '学这课' };

/** 一组推荐事件 → 卡片列表；点击进学习流（做完自动结算+刷新）。 */
function renderEventCards(parent, events, emptyText) {
  if (!events || !events.length) {
    parent.appendChild(el('div', 'hint', emptyText || '暂无可推荐事件（都已学完或无就绪节点）。'));
    return;
  }
  for (const e of events) {
    const card = el('div', 'card event-card');
    const main = el('div', 'ev-main');
    const head = el('div');
    head.appendChild(el('span', `ev-badge ${e.type}`, EV_LABEL[e.type] || e.type));
    head.appendChild(el('strong', '', e.node));
    main.appendChild(head);
    main.appendChild(el('div', 'meta',
      `[${e.course} · ${e.region}] ${e.why} ｜ 优先级 ${e.score}`));
    card.appendChild(main);
    actionButton(card, EV_BTN[e.type] || '开始', () => switchTab('study', { course: e.course, node: e.node }), true);
    parent.appendChild(card);
  }
}

/* ============ 课程工作区（树形：区/块/节点 + 题库作答） ============ */
const BANK_KIND_LABEL = { single_choice: '单选', true_false: '判断', fill_in_blank: '填空', reflection: '开放' };

async function renderWorkspace() {
  appEl.appendChild(el('h3', '', '课程工作区'));
  let doc;
  try { doc = await api('/courses/tree'); } catch (err) {
    appEl.appendChild(el('pre', '', err.message));
    return;
  }
  for (const c of doc.courses) {
    const cwrap = el('div', 'card');
    cwrap.appendChild(el('h4', '', `${c.name}（${c.id || '-'}）`));
    for (const r of c.regions) {
      const rhead = el('div', 'tree-region');
      rhead.textContent = r.name;
      rhead.style.borderLeftColor = r.color || '#888';
      cwrap.appendChild(rhead);
      for (const b of r.blocks) {
        cwrap.appendChild(el('div', 'tree-block', '· ' + b.name));
        for (const n of b.nodes) {
          const row = el('div', 'tree-node');
          const dot = el('span', 'sw');
          dot.style.background = STAGE_COLOR[n.stage] || '#999';
          row.appendChild(dot);
          row.appendChild(el('strong', '', n.node + (n.opt ? '（可选）' : '')));
          const statusTxt = n.contentVersion === 0 ? '未生成'
            : `v${n.contentVersion}${n.contentStatus === 'draft' ? '（草稿）' : n.contentStatus === 'flagged' ? '（待重生成）' : ''}`;
          row.appendChild(el('span', 'meta',
            `${n.stage} ｜ 掌握 ${Math.round((n.mastery || 0) * 100)}% ｜ ${statusTxt}${n.hasBank ? ' ｜ 有题库' : ''}`));
          const learnBtn = el('button', '', '学习');
          learnBtn.addEventListener('click', () => switchTab('study', { course: c.name, node: n.node }));
          row.appendChild(learnBtn);
          const bankBtn = el('button', '', '题库');
          bankBtn.addEventListener('click', () => { state.bankCourse = c.name; state.bankNode = n.node; render(); });
          row.appendChild(bankBtn);
          cwrap.appendChild(row);
        }
      }
    }
    appEl.appendChild(cwrap);
  }
  if (state.bankNode) await renderBankSection();
}

async function renderBankSection() {
  const wrap = el('div', 'card');
  const head = el('h4');
  head.textContent = `题库 · ${state.bankCourse} / ${state.bankNode}`;
  const close = el('button', '', '收起');
  close.addEventListener('click', () => { state.bankNode = ''; state.bankCourse = ''; render(); });
  head.appendChild(close);
  wrap.appendChild(head);
  wrap.appendChild(el('div', 'hint',
    '作答即自动判卷并计入练习证据（错题公布答案/解析）；调度评分仍走学习流的自评 1-4。建题库让 agent 调 learnhub_question_save。'));
  appEl.appendChild(wrap);
  let doc;
  try { doc = await api(`/questions?course=${encodeURIComponent(state.bankCourse)}&node=${encodeURIComponent(state.bankNode)}`); } catch (err) {
    wrap.appendChild(el('pre', '', err.message));
    return;
  }
  if (!doc.questions || !doc.questions.length) {
    wrap.appendChild(el('div', 'hint', '该节点还没有题库（可让 agent 用 learnhub_question_save 生成）。'));
    return;
  }
  for (const q of doc.questions) {
    const box = el('div', 'bank-q');
    const head1 = el('div');
    head1.appendChild(el('span', 'kind', BANK_KIND_LABEL[q.kind] || q.kind));
    head1.appendChild(el('span', 'kind', `难度 ${q.difficulty}`));
    head1.appendChild(el('strong', '', `${q.no}. ${q.q}`));
    box.appendChild(head1);
    const inputWrap = el('div');
    let collect = () => null;
    if (q.kind === 'single_choice' && q.options) {
      for (const opt of q.options) {
        const lab = el('label', 'opt-row');
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `bank-${q.id}`;
        radio.value = opt.charAt(0).toUpperCase();
        lab.appendChild(radio);
        lab.appendChild(document.createTextNode(' ' + opt));
        inputWrap.appendChild(lab);
      }
      collect = () => {
        const sel = inputWrap.querySelector('input:checked');
        return sel ? sel.value : null;
      };
    } else if (q.kind === 'true_false') {
      collect = () => {
        const sel = inputWrap.querySelector('input:checked');
        return sel ? sel.value : null;
      };
      for (const [val, label] of [['true', '对'], ['false', '错']]) {
        const lab = el('label', 'opt-row');
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `bank-${q.id}`;
        radio.value = val;
        lab.appendChild(radio);
        lab.appendChild(document.createTextNode(' ' + label));
        inputWrap.appendChild(lab);
      }
    } else if (q.kind === 'fill_in_blank') {
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '填入答案';
      input.style.cssText = 'width: 60%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: inherit;';
      inputWrap.appendChild(input);
      collect = () => input.value;
    } else {
      const ta = document.createElement('textarea');
      ta.className = 'answer';
      ta.placeholder = '写下你的回答（AI 按评分要点判卷）';
      inputWrap.appendChild(ta);
      collect = () => ta.value;
    }
    box.appendChild(inputWrap);
    const result = el('div', 'result');
    result.style.display = 'none';
    box.appendChild(result);
    const submit = el('button', 'primary', '提交作答');
    submit.addEventListener('click', async () => {
      const answer = collect();
      if (answer === null || answer === '' ) { toast('先作答再提交', true); return; }
      submit.disabled = true;
      try {
        const r = await api('/question-answer', {
          course: state.bankCourse, node: state.bankNode, qid: q.id, answer,
        });
        result.style.display = '';
        result.textContent = '';
        const verdict = el('div', '', `${r.correct ? '✓ 正确' : '✗ 不对'}${r.kind === 'reflection' ? `（${r.score} 分）` : ''}`);
        verdict.style.color = r.correct ? 'var(--good, #2e7d32)' : 'var(--warn, #b71c1c)';
        result.appendChild(verdict);
        if (r.explanation) result.appendChild(el('div', 'hint', '解析：' + r.explanation));
        if (!r.correct && r.answer !== undefined) result.appendChild(el('div', 'hint', '答案/要点：' + r.answer));
        // 引擎把解析并入 feedback 时避免同文重复展示
        if (r.feedback && r.feedback !== r.explanation) result.appendChild(el('div', 'hint', r.feedback));
        submit.textContent = '重新提交';
      } catch (err) {
        toast(err.message, true);
      } finally {
        submit.disabled = false;
      }
    });
    box.appendChild(submit);
    wrap.appendChild(box);
  }
}

/* ============ 仪表盘（动态推荐为主，课程状态为辅） ============ */
async function renderDashboard() {
  appEl.appendChild(el('h3', '', '学习中心'));
  const bar = el('div', 'actions');
  actionButton(bar, '重建全部', async () => {
    const r = await api('/rebuild');
    toast(r.message || '已重建');
    await renderDashboard();
  });
  actionButton(bar, '刷新', () => renderDashboard());
  appEl.appendChild(bar);

  // 动态推荐：接下来做哪 5 件事自己挑，做完自动结算并取下一批，无需提前规划
  const recCard = el('div', 'card');
  recCard.appendChild(el('h4', '', '接下来做什么？——推荐事件队列'));
  recCard.appendChild(el('div', 'hint',
    '优先级规则：逾期复习（越久、记忆越弱越急）> 今日到期 > 半途未完成的课 > 新课（先学解锁后继多的，区间轮转）。做完一个自动结算、自动刷新下一批。'));
  const evBox = el('div');
  evBox.appendChild(el('div', 'hint', '推荐加载中…'));
  recCard.appendChild(evBox);
  appEl.appendChild(recCard);
  try {
    const rec = await api('/recommend?limit=5');
    evBox.textContent = '';
    renderEventCards(evBox, rec.events);
  } catch (err) {
    evBox.textContent = '';
    evBox.appendChild(el('pre', '', '推荐获取失败：' + err.message));
  }

  const hint = el('div', 'hint', '加载状态中…');
  appEl.appendChild(hint);
  let doc;
  try {
    doc = await api('/status');
  } catch (err) {
    hint.remove();
    appEl.appendChild(el('pre', '', '引擎调用失败：' + err.message));
    return;
  }
  hint.remove();

  appEl.appendChild(el('div', 'date', `状态日期：${doc.date}`));
  for (const c of doc.courses) {
    const card = el('div', 'card');
    card.appendChild(el('h4', '', `${c.name}（${c.id}）`));
    const counts = c.counts || {};
    card.appendChild(el('div', 'meta',
      `节点 ${c.total} ｜ mastered ${counts.mastered ?? 0} · review ${counts.review ?? 0} · learning ${counts.learning ?? 0} · ready ${counts.ready ?? 0}`));
    if ((c.overdue || []).length) {
      const ul = el('ul', 'overdue');
      for (const o of c.overdue.slice(0, 8)) {
        const li = el('li');
        li.appendChild(el('span', 'warn', '⚠ '));
        li.appendChild(nodeLink(c.name, o.node));
        li.appendChild(el('span', '', `（${o.since} 起到期，R=${Math.round(o.r * 100)}%）`));
        ul.appendChild(li);
      }
      card.appendChild(ul);
    } else {
      card.appendChild(el('div', 'ok', '✓ 无过期复习'));
    }
    if ((c.ready || []).length) {
      const box = el('div', 'ready', '就绪新课：');
      appendNodeRefs(box, c.name, c.ready);
      card.appendChild(box);
    }
    if ((c.gated || []).length) {
      const box = el('div', 'gated', 'R_gate 守门后可学：');
      appendNodeRefs(box, c.name, c.gated);
      card.appendChild(box);
    }
    appEl.appendChild(card);
  }
}

/** 可点击节点：点击进学习流（全链路入口；单独刷题走「练习面板」）。 */
function nodeLink(course, node) {
  const span = el('span', 'node', node);
  span.addEventListener('click', () => switchTab('study', { course, node }));
  return span;
}

/** 一组节点：顿号分隔。 */
function appendNodeRefs(parent, course, refs) {
  refs.forEach((r, i) => {
    if (i) parent.appendChild(el('span', '', '、'));
    parent.appendChild(nodeLink(course, r.node));
  });
}

/* ============ 学习流（全链路：分节课程 → 练习 → 评分 → 下一节点） ============ */
const lesson = {
  doc: null,               // lesson pack（/lesson 返回）
  steps: [],               // [{kind:'section',section}|{kind:'exercises'}|{kind:'rate'}]
  step: 0,
  exIndex: 0,              // 练习步当前题号
  exJudged: false,         // 当前题是否已判
  results: new Map(),      // ex → bool
  graded: false,
};

async function renderStudy() {
  // 学习中切走再切回：继续当前步，不丢进度。
  if (lesson.doc && state.tab === 'study' && !state.skipPicker) {
    renderLessonStep();
    return;
  }
  if (state.skipPicker && state.course && state.node) {
    state.skipPicker = false;
    await startLesson(state.course, state.node);
    return;
  }
  await renderStudyPicker();
}

/** 入口：跨课混合推荐列表 + 自由输入节点（不先选课，引擎跨课唯一命中）。 */
async function renderStudyPicker() {
  lesson.doc = null;
  appEl.appendChild(el('h3', '', '学习'));
  const row = el('div', 'picker');
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '输入节点名（不用选课，跨课程自动匹配；歧义时用 课程/节点）';
  input.value = state.node;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.value.trim()) startLesson('', input.value.trim());
  });
  row.appendChild(input);
  actionButton(row, '开始学习', async () => {
    const node = input.value.trim();
    if (!node) { toast('请输入节点名', true); return; }
    await startLesson('', node);
  }, true);
  appEl.appendChild(row);
  appEl.appendChild(el('div', 'hint',
    '学习流程：分节课程 →「下一步」逐节推进 → 练习题逐题判卷 → 自评 1-4 自动入库 → 推荐下一批事件。全程无需打开 OB。'));

  // 跨课混合推荐：不同领域按同一优先级规则排在一起，卡片标明所属课程/分区
  appEl.appendChild(el('h4', '', '接下来学什么（跨课程混合推荐）'));
  const box = el('div');
  box.appendChild(el('div', 'hint', '推荐加载中…'));
  appEl.appendChild(box);
  try {
    const rec = await api('/recommend?limit=8');
    box.textContent = '';
    renderEventCards(box, rec.events);
  } catch (err) {
    box.textContent = '';
    box.appendChild(el('pre', '', err.message));
  }
}

/** 拉取 lesson pack 并重置步骤机（course 可空：引擎跨课唯一命中后回填）。 */
async function startLesson(course, node) {
  let doc;
  try {
    const q = `/lesson?node=${encodeURIComponent(node)}` + (course ? `&course=${encodeURIComponent(course)}` : '');
    doc = await api(q);
  } catch (err) {
    toast(err.message, true);
    lesson.doc = null;
    await renderStudyPicker();
    return;
  }
  state.course = doc.course || course;
  state.node = node;
  lesson.doc = doc;
  lesson.steps = doc.sections.map(s => ({ kind: 'section', section: s }));
  if ((doc.exercises || []).length) lesson.steps.push({ kind: 'exercises' });
  lesson.steps.push({ kind: 'rate' });
  lesson.step = 0;
  lesson.exIndex = 0;
  lesson.exJudged = false;
  lesson.results.clear();
  lesson.graded = false;
  renderLessonStep();
}

function stepLabel(s) {
  if (s.kind === 'section') return s.section.title;
  if (s.kind === 'exercises') return `练习（${lesson.doc.exercises.length} 题）`;
  return '评分';
}

/** 当前步渲染：进度条 + 分步内容 + 导航。 */
function renderLessonStep() {
  appEl.textContent = '';
  const d = lesson.doc;
  appEl.appendChild(el('h3', '', `学习：[${d.course}] ${d.node}`));
  appEl.appendChild(el('div', 'meta',
    `${d.region} ｜ stage=${d.stage} ｜ 掌握度 ${Math.round((d.mastery || 0) * 100)}%`));
  const bar = el('div', 'lesson-progress');
  lesson.steps.forEach((s, i) => {
    const dot = el('span', 'lp-dot' + (i === lesson.step ? ' cur' : i < lesson.step ? ' done' : ''), stepLabel(s));
    if (i < lesson.step) dot.style.cursor = 'pointer';
    dot.addEventListener('click', () => { if (i < lesson.step) { lesson.step = i; renderLessonStep(); } });
    bar.appendChild(dot);
  });
  appEl.appendChild(bar);

  const cur = lesson.steps[lesson.step];
  if (cur.kind === 'section') renderSectionStep(cur.section);
  else if (cur.kind === 'exercises') renderExerciseStep();
  else renderRateStep();
}

/** 分节课程步：Markdown/LaTeX 正文 + 上/下一步。 */
function renderSectionStep(section) {
  const card = el('div', 'card');
  card.appendChild(el('h4', '', section.title));
  const body = el('div', 'lesson-body');
  renderRich(body, section.md);
  card.appendChild(body);
  appEl.appendChild(card);
  const nav = el('div', 'lesson-nav');
  if (lesson.step > 0) actionButton(nav, '← 上一步', () => { lesson.step--; renderLessonStep(); });
  const last = lesson.step === lesson.steps.length - 1;
  actionButton(nav, last ? '完成' : '下一步 →', () => { lesson.step++; renderLessonStep(); }, true);
  appEl.appendChild(nav);
}

/** 练习步：逐题判卷（sympy 直接判 / human 看答案自评）。 */
function renderExerciseStep() {
  const items = lesson.doc.exercises;
  if (lesson.exIndex >= items.length) { lesson.step++; renderLessonStep(); return; }
  const it = items[lesson.exIndex];
  const card = el('div', 'ex');
  card.appendChild(el('div', 'ex-tag',
    `第 ${lesson.exIndex + 1}/${items.length} 题 ｜ ex${it.ex}（难度 ${it.difficulty} · ${it.check}）`));
  const q = el('div', 'ex-q');
  renderRich(q, it.q);
  card.appendChild(q);
  const fb = el('div', 'ex-fb');
  card.appendChild(fb);
  const judged = lesson.results.has(it.ex);
  if (judged) {
    fb.textContent = lesson.results.get(it.ex) ? '✓ 正确' : '✗ 不对';
    fb.className = 'ex-fb ' + (lesson.results.get(it.ex) ? 'good' : 'bad');
  }
  const row = el('div', 'ex-row');
  const goNext = () => {
    lesson.exIndex++;
    lesson.exJudged = false;
    renderLessonStep();
  };
  if (!judged && it.check === 'sympy') {
    const input = document.createElement('input');
    input.type = 'text'; input.placeholder = '你的答案';
    const btn = el('button', '', '判卷');
    const submit = async () => {
      const answer = input.value.trim();
      if (!answer) return;
      btn.disabled = true;
      try {
        const doc = await api('/check', { node: state.node, ex: it.ex, answer, course: state.course });
        lesson.results.set(it.ex, !!doc.correct);
        fb.textContent = doc.correct ? '✓ 正确' : `✗ 不对（参考答案：${doc.answer}）`;
        fb.className = 'ex-fb ' + (doc.correct ? 'good' : 'bad');
        row.textContent = '';
        actionButton(row, lesson.exIndex + 1 < items.length ? '下一题 →' : '去评分 →', goNext, true);
      } catch (err) {
        toast('判卷失败：' + err.message.slice(0, 120), true);
      } finally {
        btn.disabled = false;
      }
    };
    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    row.appendChild(input);
    row.appendChild(btn);
  } else if (!judged && it.check === 'choice' && Array.isArray(it.options) && it.options.length) {
    // choice：radio 选项 → /check 字母归一化机器判卷
    const opts = el('div', 'opts');
    it.options.forEach((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const label = document.createElement('label');
      label.className = 'opt-row';
      const radio = document.createElement('input');
      radio.type = 'radio'; radio.name = `choice-${it.ex}`; radio.value = letter;
      label.appendChild(radio);
      label.appendChild(document.createTextNode(/^[A-Z][)）]/.test(opt) ? opt : `${letter}) ${opt}`));
      opts.appendChild(label);
    });
    row.appendChild(opts);
    const btn = el('button', '', '判卷');
    btn.addEventListener('click', async () => {
      const sel = opts.querySelector('input:checked');
      if (!sel) { toast('请先选择一个选项', true); return; }
      btn.disabled = true;
      try {
        const doc = await api('/check', { node: state.node, ex: it.ex, answer: sel.value, course: state.course });
        lesson.results.set(it.ex, !!doc.correct);
        fb.textContent = doc.correct ? '✓ 正确' : `✗ 不对（正确答案：${doc.answer}）`;
        fb.className = 'ex-fb ' + (doc.correct ? 'good' : 'bad');
        row.textContent = '';
        actionButton(row, lesson.exIndex + 1 < items.length ? '下一题 →' : '去评分 →', goNext, true);
      } catch (err) {
        toast('判卷失败：' + err.message.slice(0, 120), true);
      } finally {
        btn.disabled = false;
      }
    });
    row.appendChild(btn);
  } else if (!judged && it.check === 'ai') {
    // ai 开放题：textarea 作答 → host 调模型判卷（30–90s）后落库
    const ta = document.createElement('textarea');
    ta.className = 'answer'; ta.placeholder = '写下你的解答…';
    row.appendChild(ta);
    const btn = el('button', 'primary', '提交 AI 判卷');
    btn.addEventListener('click', async () => {
      const answer = ta.value.trim();
      if (!answer) { toast('请先写下解答', true); return; }
      btn.disabled = true; btn.textContent = 'AI 判卷中（约 30–90 秒）…';
      try {
        const doc = await api('/ai-grade', { course: state.course, node: state.node, ex: it.ex, answer });
        lesson.results.set(it.ex, !!doc.correct);
        fb.style.whiteSpace = 'pre-line';
        fb.textContent = `${doc.correct ? '✓' : '✗'} ${doc.verdict || (doc.correct ? '对' : '错')}（${doc.score} 分）`
          + (doc.feedback ? `：${doc.feedback}` : '')
          + (doc.suggestions ? `\n建议：${doc.suggestions}` : '');
        fb.className = 'ex-fb ' + (doc.correct ? 'good' : 'bad');
        row.textContent = '';
        actionButton(row, lesson.exIndex + 1 < items.length ? '下一题 →' : '去评分 →', goNext, true);
      } catch (err) {
        toast('AI 判卷失败：' + err.message.slice(0, 160), true);
      } finally {
        btn.disabled = false; btn.textContent = '提交 AI 判卷';
      }
    });
    row.appendChild(btn);
  } else if (!judged) {
    const btn = el('button', '', '看答案自评');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      let answer = '';
      try {
        const doc = await api('/check', { node: state.node, ex: it.ex, answer: '', course: state.course });
        answer = doc.answer ?? '';
      } catch {}
      finally { btn.disabled = false; }
      fb.textContent = `参考答案：${answer}`;
      fb.className = 'ex-fb';
      const self = el('span', 'self');
      const mark = ok => {
        lesson.results.set(it.ex, ok);
        fb.textContent = (ok ? '✓ 自评正确' : '✗ 自评不对');
        fb.className = 'ex-fb ' + (ok ? 'good' : 'bad');
        row.textContent = '';
        actionButton(row, lesson.exIndex + 1 < items.length ? '下一题 →' : '去评分 →', goNext, true);
      };
      const yes = el('button', '', '我对了');
      yes.addEventListener('click', () => mark(true));
      const no = el('button', '', '我错了');
      no.addEventListener('click', () => mark(false));
      self.appendChild(yes);
      self.appendChild(no);
      row.appendChild(self);
    });
    row.appendChild(btn);
  } else {
    actionButton(row, lesson.exIndex + 1 < items.length ? '下一题 →' : '去评分 →', goNext, true);
  }
  card.appendChild(row);
  appEl.appendChild(card);
  const nav = el('div', 'lesson-nav');
  actionButton(nav, '← 回上一步', () => { lesson.step--; renderLessonStep(); });
  appEl.appendChild(nav);
}

/** 评分步：建议分 + 1-4 手动覆盖 → learn grade 直写权威库 → 推荐下一节点。 */
function renderRateStep() {
  const d = lesson.doc;
  const card = el('div', 'card');
  card.appendChild(el('h4', '', '学完了，给自己打个分'));
  const items = d.exercises || [];
  let ok = 0;
  for (const v of lesson.results.values()) if (v) ok++;
  if (items.length) {
    card.appendChild(el('div', 'meta', `练习 ${ok}/${items.length} 正确`));
  } else {
    card.appendChild(el('div', 'meta', '本节点没有练习题，按理解程度自评。'));
  }
  // 建议分：与练习面板同规则；无练习时默认 3。
  let suggest = 3;
  if (items.length && lesson.results.size === items.length) {
    const ratio = ok / items.length;
    suggest = ok === items.length ? 4 : ratio >= 0.7 ? 3 : ratio >= 0.4 ? 2 : 1;
  }
  card.appendChild(el('div', '', `建议评分：${suggest}（1=忘了 / 2=费劲 / 3=正常 / 4=轻松）`));
  const rateRow = el('div', 'rate-row');
  if (lesson.graded) {
    rateRow.appendChild(el('span', 'ok', '✓ 已入库（FSRS 调度已更新）'));
  } else {
    for (const r of [1, 2, 3, 4]) {
      const btn = el('button', r === suggest ? 'primary' : '', `${r}`);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const res = await api('/grade', { course: state.course, node: state.node, rating: r });
          lesson.graded = true;
          toast(res.message || `评分 ${r} 已入库`);
          renderLessonStep();
          // 评分后头部 stage/掌握度已变：重拉 lesson 包刷新显示（不阻塞当前渲染）
          api(`/lesson?node=${encodeURIComponent(state.node)}&course=${encodeURIComponent(state.course)}`)
            .then(d => { lesson.doc.stage = d.stage; lesson.doc.mastery = d.mastery; renderLessonStep(); })
            .catch(() => {});
        } catch (err) {
          toast('评分失败：' + err.message, true);
          btn.disabled = false;
        }
      });
      rateRow.appendChild(btn);
    }
  }
  card.appendChild(rateRow);
  appEl.appendChild(card);

  // 下一步：动态推荐队列（评分入库后队列即被刷新，无需手工结算）
  const next = el('div', 'card');
  next.appendChild(el('h4', '', lesson.graded ? '已结算 ✓ 下一批推荐（已自动刷新）' : '下一步推荐'));
  const box = el('div');
  box.appendChild(el('div', 'hint', '推荐加载中…'));
  next.appendChild(box);
  appEl.appendChild(next);
  api('/recommend?limit=5').then(rec => {
    box.textContent = '';
    renderEventCards(box, rec.events, '暂无其他推荐，可在仪表盘「重建全部」后刷新。');
  }).catch(err => {
    box.textContent = '';

function renderItems() {
  const list = document.getElementById('exlist');
  list.textContent = '';
  for (const it of state.items) {
    const card = el('div', 'ex');
    card.appendChild(el('div', 'ex-tag', `ex${it.ex}（难度 ${it.difficulty} · ${it.check}）`));
    const q = el('div', 'ex-q');
    renderRich(q, it.q);
    card.appendChild(q);
    const fb = el('div', 'ex-fb');
    card.appendChild(fb);
    const done = state.results.get(it.ex);
    if (done !== undefined) {
      fb.textContent = done ? '✓ 正确' : '✗ 不对';
      fb.classList.add(done ? 'good' : 'bad');
    }
    if (it.check === 'sympy') {
      const row = el('div', 'ex-row');
      const input = document.createElement('input');
      input.type = 'text'; input.placeholder = '你的答案';
      const btn = el('button', '', '判卷');
      const submit = async () => {
        const answer = input.value.trim();
        if (!answer) return;
        btn.disabled = true;
        try {
          const doc = await api('/check', { node: state.node, ex: it.ex, answer, course: state.course });
          state.results.set(it.ex, !!doc.correct);
          fb.textContent = doc.correct ? '✓ 正确' : `✗ 不对（参考答案：${doc.answer}）`;
          fb.className = 'ex-fb ' + (doc.correct ? 'good' : 'bad');
        } catch (err) {
          toast('判卷失败：' + err.message.slice(0, 120), true);
        } finally {
          btn.disabled = false;
        }
        renderSummary();
      };
      btn.addEventListener('click', submit);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
      row.appendChild(input);
      row.appendChild(btn);
      card.appendChild(row);
    } else if (it.check === 'choice' && Array.isArray(it.options) && it.options.length) {
      const row = el('div', 'ex-row');
      const opts = el('div', 'opts');
      it.options.forEach((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        const label = document.createElement('label');
        label.className = 'opt-row';
        const radio = document.createElement('input');
        radio.type = 'radio'; radio.name = `choice-p-${it.ex}`; radio.value = letter;
        label.appendChild(radio);
        label.appendChild(document.createTextNode(/^[A-Z][)）]/.test(opt) ? opt : `${letter}) ${opt}`));
        opts.appendChild(label);
      });
      row.appendChild(opts);
      const btn = el('button', '', '判卷');
      btn.addEventListener('click', async () => {
        const sel = opts.querySelector('input:checked');
        if (!sel) { toast('请先选择一个选项', true); return; }
        btn.disabled = true;
        try {
          const doc = await api('/check', { node: state.node, ex: it.ex, answer: sel.value, course: state.course });
          state.results.set(it.ex, !!doc.correct);
          fb.textContent = doc.correct ? '✓ 正确' : `✗ 不对（正确答案：${doc.answer}）`;
          fb.className = 'ex-fb ' + (doc.correct ? 'good' : 'bad');
        } catch (err) {
          toast('判卷失败：' + err.message.slice(0, 120), true);
        } finally {
          btn.disabled = false;
        }
        renderSummary();
      });
      row.appendChild(btn);
      card.appendChild(row);
    } else if (it.check === 'ai') {
      const row = el('div', 'ex-row');
      const ta = document.createElement('textarea');
      ta.className = 'answer'; ta.placeholder = '写下你的解答…';
      row.appendChild(ta);
      const btn = el('button', 'primary', '提交 AI 判卷');
      btn.addEventListener('click', async () => {
        const answer = ta.value.trim();
        if (!answer) { toast('请先写下解答', true); return; }
        btn.disabled = true; btn.textContent = 'AI 判卷中（约 30–90 秒）…';
        try {
          const doc = await api('/ai-grade', { course: state.course, node: state.node, ex: it.ex, answer });
          state.results.set(it.ex, !!doc.correct);
          fb.style.whiteSpace = 'pre-line';
          fb.textContent = `${doc.correct ? '✓' : '✗'} ${doc.verdict || (doc.correct ? '对' : '错')}（${doc.score} 分）`
            + (doc.feedback ? `：${doc.feedback}` : '')
            + (doc.suggestions ? `\n建议：${doc.suggestions}` : '');
          fb.className = 'ex-fb ' + (doc.correct ? 'good' : 'bad');
        } catch (err) {
          toast('AI 判卷失败：' + err.message.slice(0, 160), true);
        } finally {
          btn.disabled = false; btn.textContent = '提交 AI 判卷';
        }
        renderSummary();
      });
      row.appendChild(btn);
      card.appendChild(row);
    } else {
      const row = el('div', 'ex-row');
      const btn = el('button', '', '看答案自评');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        let answer = '';
        try {
          const doc = await api('/check', { node: state.node, ex: it.ex, answer: '', course: state.course });
          answer = doc.answer ?? '';
        } catch {}
        finally { btn.disabled = false; }
        fb.textContent = `参考答案：${answer}`;
        fb.className = 'ex-fb';
        const self = el('span', 'self');
        const yes = el('button', '', '我对了');
        const no = el('button', '', '我错了');
        yes.addEventListener('click', () => {
          state.results.set(it.ex, true);
          fb.textContent = '✓ 自评正确';
          fb.className = 'ex-fb good';
          renderSummary();
        });
        no.addEventListener('click', () => {
          state.results.set(it.ex, false);
          fb.textContent = '✗ 自评不对';
          fb.className = 'ex-fb bad';
          renderSummary();
        });
        self.appendChild(yes);
        self.appendChild(no);
        row.appendChild(self);
      });
      row.appendChild(btn);
      card.appendChild(row);
    }
    list.appendChild(card);
  }
}

/** 建议评分：全对 4 / ≥70% 3 / ≥40% 2 / 其余 1（07 §6 / 计划裁决）。 */
function suggestedRating() {
  if (!state.items.length || state.results.size < state.items.length) return null;
  let ok = 0;
  for (const v of state.results.values()) if (v) ok++;
  const ratio = ok / state.items.length;
  if (ok === state.items.length) return 4;
  if (ratio >= 0.7) return 3;
  if (ratio >= 0.4) return 2;
  return 1;
}

function renderSummary() {
  const box = document.getElementById('summary');
  if (!box) return;
  box.textContent = '';
  const answered = state.results.size;
  let ok = 0;
  for (const v of state.results.values()) if (v) ok++;
  box.appendChild(el('div', 'meta', `已作答 ${answered}/${state.items.length} ｜ 正确 ${ok}`));
  const rating = suggestedRating();
  if (rating === null) {
    box.appendChild(el('div', 'hint',
      '全部作答后自动算分并写回今日工作单（全对4 / ≥70% 3 / ≥40% 2 / 其余1）。'));
    return;
  }
  box.appendChild(el('div', '', `建议评分：${rating}（1=忘了 / 2=费劲 / 3=正常 / 4=轻松）`));
  if (state.autoWritePending) {
    state.autoWritePending = false;
    api('/writeback', { course: state.course, node: state.node, rating })
      .then(r => { if (r.ok) toast(r.message); else toast(r.message, true); })
      .catch(err => toast('写回失败：' + err.message, true));
  }
}

const STAGE_COLOR = {

async function loadGraph() {
  if (!window.cytoscape) {
    const info = document.getElementById('cy-info');
    if (info) info.textContent = 'cytoscape CDN 加载失败，无法渲染图谱。';
    return;
  }
  let data;
  try {
    data = await api(`/graph?course=${encodeURIComponent(state.course)}&elements=1`);
  } catch (err) {
    toast('图谱加载失败：' + err.message, true);
    return;
  }
  const elements = [
    ...(data.nodes || []),
    ...(data.edges || []).map(e => ({ data: e.data, classes: e.data.kind === 'enc' ? 'enc' : '' })),
  ];
  // 防御：丢弃指向不存在节点的边，避免单条脏数据让整个 cytoscape 初始化失败。
  const nodeIds = new Set((data.nodes || []).map(n => n.data.id));
  const valid = elements.filter(e => {
    if (e.data.source === undefined) return true;
    const ok = nodeIds.has(e.data.source) && nodeIds.has(e.data.target);
    if (!ok) console.warn('[learnhub] 丢弃断边:', e.data.source, '->', e.data.target);
    return ok;
  });
  if (cyInstance) cyInstance.destroy();
  try {
    cyInstance = window.cytoscape({
      container: document.getElementById('cy'),
      elements: valid,
    style: [
      { selector: 'node', style: {
        'background-color': ele => STAGE_COLOR[ele.data('stage')] || '#999',
        label: 'data(id)', 'font-size': 9, color: '#888',
        'text-valign': 'bottom', 'text-margin-y': 2, width: 14, height: 14,
      } },
      { selector: 'edge', style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle',
        'line-color': '#c8c2b8', 'target-arrow-color': '#c8c2b8', width: 1,
        'arrow-scale': 0.8,
      } },
      { selector: 'edge.enc', style: { 'line-style': 'dashed' } },
      { selector: '.focus', style: { 'background-color': '#c0392b', 'font-size': 12, color: '#c0392b', 'z-index': 5 } },
    ],
    layout: { name: 'breadthfirst', spacingFactor: 1.15, padding: 24, animate: false },
    wheelSensitivity: 0.2,
  });
  } catch (err) {
    toast('图谱渲染失败：' + err.message, true);
    return;
  }
  cyInstance.on('tap', 'node', evt => {
    const d = evt.target.data();
    cyInstance.$('.focus').removeClass('focus');
    evt.target.addClass('focus');
    const info = document.getElementById('cy-info');
    if (info) info.textContent =
      `${d.id} ｜ ${d.region} / ${d.block} ｜ stage=${d.stage}`
      + (d.due ? ` ｜ 到期 ${d.due}` : '') + ` ｜ 掌握度 ${Math.round((d.mastery || 0) * 100)}% ｜ 深度 ${d.depth}`
      + (d.opt ? ' ｜ 可选' : '');
    const learnBtn = document.getElementById('cy-learn');
    if (learnBtn) {
      learnBtn.style.display = '';
      learnBtn.dataset.node = d.id;
    }
  });
  cyInstance.on('dbltap', 'node', evt => {
    switchTab('practice', { course: state.course, node: evt.target.data('id') });
  });
  const info = document.getElementById('cy-info');
  if (info) info.textContent = `节点 ${(data.nodes || []).length} ｜ 边 ${(data.edges || []).length}`
    + (valid.length < elements.length ? `（已过滤 ${elements.length - valid.length} 条断边）` : '');
}

/* ============ 统计 ============ */
async function renderStats() {
  appEl.appendChild(el('h3', '', '学习统计'));
  const bar = el('div', 'actions');
  actionButton(bar, '刷新', () => renderStats());
  appEl.appendChild(bar);

  let full, doctor, status;
  try {
    [full, doctor, status] = await Promise.all([
      api(`/graph${state.course ? `?course=${encodeURIComponent(state.course)}` : ''}`),
      api('/doctor'),
      api('/status'),
    ]);
  } catch (err) {
    appEl.appendChild(el('pre', '', err.message));
    return;
  }

  // 状态分布（来自渲染元素）
  const dist = {};
  for (const n of (full.elements && full.elements.nodes) || []) {
    const s = n.data.stage || 'unknown';
    dist[s] = (dist[s] || 0) + 1;
  }
  const grid = el('div', 'stats-grid');
  for (const [s, n] of Object.entries(dist)) {
    const cell = el('div', 'stat-cell');
    cell.appendChild(el('div', 'n', String(n)));
    cell.appendChild(el('div', 't', s));
    grid.appendChild(cell);
  }
  appEl.appendChild(grid);

  // 结构指标
  const st = full.structure || {};
  const sCard = el('div', 'card');
  sCard.appendChild(el('h4', '', `结构：${full.course || ''}（${full.date || ''}）`));
  sCard.appendChild(el('div', 'meta',
    `节点 ${st.nodes ?? '-'} ｜ pre 边 ${st.pre_edges ?? '-'} ｜ 根 ${st.roots ?? '-'} ｜ 叶 ${st.leaves ?? '-'} ｜ 最大深度 ${st.max_depth ?? '-'}`));
  const health = [];
  if ((st.broken_refs || []).length) health.push(`✗ 断引用 ${st.broken_refs.length}`);
  if ((st.cycles || []).length) health.push(`✗ 环 ${st.cycles.length}`);
  if ((st.unreachable || []).length) health.push(`⚠ 不可达节点 ${st.unreachable.length}`);
  if (!health.length) health.push('✓ 无断引用 / 无环 / 无不可达');
  sCard.appendChild(el('div', (health[0].startsWith('✓') ? 'ok' : 'meta'), health.join('；')));
  if ((st.bottlenecks || []).length) {
    sCard.appendChild(el('div', 'meta', '瓶颈节点（中介中心性）：'
      + st.bottlenecks.slice(0, 5).map(b => `${b.node}(${b.betweenness.toFixed(3)})`).join('、')));
  }
  appEl.appendChild(sCard);

  // 学习侧热点
  const ln = full.learning || {};
  const lCard = el('div', 'card');
  lCard.appendChild(el('h4', '', '学习热点'));
  const rows = [
    ['遗忘热点', ln.lapse_hotspots], ['正确率异常', ln.accuracy_anomalies], ['到期积压', ln.due_backlog],
  ];
  for (const [label, arr] of rows) {
    lCard.appendChild(el('div', 'meta', (arr || []).length
      ? `${label}：${arr.slice(0, 8).map(x => typeof x === 'string' ? x : (x.node || JSON.stringify(x))).join('、')}`
      : `${label}：无`));
  }
  appEl.appendChild(lCard);

  // 数据完整性（doctor）
  const dCard = el('div', 'card');
  dCard.appendChild(el('h4', '', '数据完整性（doctor 双读对账）'));
  for (const c of doctor.courses || []) {
    const issues = [];
    if ((c.broken_files || []).length) issues.push(`✗ 不可解析文件 ${c.broken_files.length}`);
    if ((c.drift || []).length) issues.push(`⚠ 漂移 ${c.drift.length}（db 为准，下次投影即一致）`);
    if ((c.missing_notes || []).length) issues.push(`⚠ 缺笔记 ${c.missing_notes.length}`);
    dCard.appendChild(el('div', 'meta',
      `${c.course}：节点 ${c.nodes} ｜ db 行 ${c.db_rows} ｜ 笔记 ${c.notes} ｜ ` + (issues.join('；') || '✓ 双读一致')));
  }
  appEl.appendChild(dCard);

  // 各课程进度（status）
  const pCard = el('div', 'card');
  pCard.appendChild(el('h4', '', '课程进度'));
  for (const c of status.courses || []) {
    const counts = c.counts || {};
    const done = (counts.mastered || 0) + (counts.review || 0) + (counts.learning || 0);
    const pct = c.total ? Math.round(done / c.total * 100) : 0;
    pCard.appendChild(el('div', 'meta',
      `${c.name}：已学 ${done}/${c.total}（${pct}%）｜ 逾期 ${(c.overdue || []).length} ｜ 就绪 ${(c.ready || []).length}`));
  }
  appEl.appendChild(pCard);
}

  appEl.appendChild(bar);
  appEl.appendChild(el('div', 'hint',
    '管线：上下文包 + 提示词模板（state/提示词/课程生成.md，可编辑）→ 模型生成 → 质检门（SymPy 自检 + 超纲警告）→ 落盘 draft → 人审。单次生成约 30–90 秒，与 agent 生成共用同一门禁。'));
  let items;
  try {
    items = await api('/queue');
  } catch (err) {
    appEl.appendChild(el('pre', '', err.message));
    return;
  }
  if (!Array.isArray(items) || !items.length) {
    appEl.appendChild(el('div', 'card', '当前没有待生成条目（队列全部完成或尚未触发）。'));
    return;
  }
  for (const it of items) {
    const card = el('div', 'card event-card');
    const main = el('div', 'ev-main');
    const head = el('div');
    head.appendChild(el('span', 'ev-badge ' + (it.kind === '重生成' ? 'review' : 'new'), it.kind));
    head.appendChild(el('strong', '', `[${it.course}] ${it.node}`));
    main.appendChild(head);
    main.appendChild(el('div', 'meta', `${it.reason} ｜ 优先：${it.priority}`));
    const acts = el('div', 'prop-actions');
    const gen = el('button', 'primary', '一键生成');
    gen.addEventListener('click', async () => {
      gen.disabled = true; gen.textContent = '生成中（约 30–90 秒）…';
      let r;
      try {
        r = await api('/generate', { course: it.course, node: it.node });
      } catch (err) {
        toast('生成失败：' + err.message, true);
        gen.disabled = false; gen.textContent = '一键生成';
        return;
      }
      toast(r.message || '生成完成（draft，待人审）');
      // 生成成功：卡片切换为人审态（质检结果 + 正文预览 + 通过/打回）
      main.textContent = '';
      const head2 = el('div');
      head2.appendChild(el('span', 'ev-badge review', '待人审'));
      head2.appendChild(el('strong', '', `[${it.course}] ${it.node}`));
      main.appendChild(head2);
      main.appendChild(el('div', 'meta', r.message || '已写入 draft。'));
      const prev = el('div', 'lesson-body');
      prev.style.display = 'none';
      let loaded = false;
      const acts2 = el('div', 'prop-actions');
      actionButton(acts2, '正文预览', async () => {
        if (!loaded) {
          const doc = await api(`/lesson?node=${encodeURIComponent(it.node)}&course=${encodeURIComponent(it.course)}`);
          for (const s of doc.sections || []) {
            prev.appendChild(el('h4', '', s.title));
            const body = el('div');
            renderRich(body, s.md);
            prev.appendChild(body);
          }
          loaded = true;
        }
        prev.style.display = prev.style.display === 'none' ? '' : 'none';
      });
      actionButton(acts2, '人审通过', async () => {
        const rv = await api('/review', { course: it.course, node: it.node });
        toast(rv.message || '已通过人审');
        appEl.textContent = '';
        await renderGeneration();
      }, true);
      actionButton(acts2, '打回', () => {
        toast('请在笔记「内容反馈」区写下意见，再用 agent 工具 learnhub_feedback 提交（自动入重生成队列）。');
      });
      main.appendChild(acts2);
      main.appendChild(prev);
    });
    acts.appendChild(gen);
    main.appendChild(acts);
    card.appendChild(main);
    appEl.appendChild(card);
  }
}

/* ============ 启动 ============ */
render();
</script>
</body>
</html>
